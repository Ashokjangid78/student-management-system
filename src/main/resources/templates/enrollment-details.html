<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <!-- ================= PREMIUM ENROLLMENT DETAILS STYLES ================= -->
        <style>
            #page-content-wrapper {
                background:
                    radial-gradient(1200px 600px at 100% -10%, rgba(67,97,238,0.08), transparent 60%),
                    radial-gradient(900px 500px at -10% 100%, rgba(114,9,183,0.06), transparent 60%),
                    #f4f6fb;
                min-height: 100vh;
            }

            /* Hero */
            .enroll-hero {
                background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
                border-radius: 1.25rem;
                padding: 1.6rem 1.8rem;
                color: #fff;
                position: relative;
                overflow: hidden;
                box-shadow: 0 18px 34px -18px rgba(67,97,238,.6);
                margin-bottom: 1.5rem;
            }
            .enroll-hero::before {
                content: "";
                position: absolute;
                right: -60px;
                top: -60px;
                width: 220px;
                height: 220px;
                border-radius: 50%;
                background: rgba(255,255,255,.08);
            }
            .enroll-hero::after {
                content: "";
                position: absolute;
                right: 60px;
                bottom: -70px;
                width: 160px;
                height: 160px;
                border-radius: 50%;
                background: rgba(255,255,255,.06);
            }

            .hero-eyebrow {
                display: inline-flex;
                align-items: center;
                gap: .4rem;
                font-size: .72rem;
                font-weight: 600;
                letter-spacing: 1px;
                text-transform: uppercase;
                background: rgba(255,255,255,.18);
                padding: .3rem .65rem;
                border-radius: 2rem;
                margin-bottom: .6rem;
            }

            .hero-title {
                font-size: 1.7rem;
                font-weight: 700;
                margin: 0;
                letter-spacing: -0.5px;
            }

            .hero-subtitle {
                margin: .35rem 0 0;
                opacity: .85;
                font-size: .9rem;
            }

            .btn-hero-back {
                background: rgba(255,255,255,.95);
                color: #4361ee;
                border: none;
                font-weight: 600;
                padding: .6rem 1.1rem;
                border-radius: .7rem;
                display: inline-flex;
                align-items: center;
                gap: .4rem;
                position: relative;
                z-index: 1;
                transition: all .2s ease;
                white-space: nowrap;
            }
            .btn-hero-back:hover {
                background: #fff;
                color: #3a0ca3;
                transform: translateY(-1px);
            }

            /* Cards */
            .detail-card {
                border-radius: 1.25rem;
                border: 1px solid #eef1f6;
                background: #fff;
                overflow: hidden;
                box-shadow: 0 12px 30px -18px rgba(20, 30, 70, .25);
                height: 100%;
            }

            .detail-card .card-header {
                background: #fff !important;
                border-bottom: 1px solid #eef1f6;
                padding: 1.1rem 1.4rem;
                border-radius: 1.25rem 1.25rem 0 0 !important;
                display: flex;
                align-items: center;
                gap: .55rem;
            }

            .detail-card .card-header i {
                width: 32px;
                height: 32px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: .6rem;
                background: rgba(67,97,238,.1);
                color: #4361ee;
            }

            .detail-card .card-header span {
                font-weight: 600;
                color: #1e2129;
                font-size: .95rem;
            }

            /* Student info block */
            .info-row {
                display: flex;
                flex-direction: column;
                gap: .15rem;
                padding: .75rem 0;
                border-bottom: 1px dashed #eef1f6;
            }
            .info-row:last-of-type { border-bottom: none; }

            .info-label {
                font-size: .72rem;
                font-weight: 600;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: .5px;
            }

            .info-value {
                font-size: .95rem;
                color: #1e2129;
                font-weight: 500;
                word-break: break-word;
            }

            /* Summary panel */
            .summary-block {
                background: #f8fafc;
                border: 1px solid #eef1f6;
                border-radius: .9rem;
                padding: 1rem 1.1rem;
                margin-top: 1rem;
            }

            .summary-label {
                color: #94a3b8;
                font-size: .74rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .5px;
            }

            .summary-value {
                color: #1e2129;
                font-weight: 700;
                font-size: 1.1rem;
            }

            .fee-highlight {
                color: #4361ee;
                font-weight: 700;
            }

            /* Table */
            .table thead th {
                background: #f8fafc;
                color: #667085;
                font-size: .72rem;
                font-weight: 700;
                letter-spacing: .8px;
                text-transform: uppercase;
                border-bottom: 1px solid #eef1f6 !important;
                padding: .9rem 1rem;
                white-space: nowrap;
            }

            .table tbody td {
                padding: 1rem;
                color: #344054;
                font-size: .9rem;
                border-color: #f2f4f8;
                vertical-align: middle;
            }

            .table tbody tr { transition: background .2s ease; }
            .table tbody tr:hover { background: #f7f9ff; }

            .table tbody td:first-child {
                font-weight: 600;
                color: #1e2129;
            }

            .table tbody td:last-child {
                color: #0f766e;
                font-weight: 600;
            }

            @media (max-width: 768px) {
                .hero-title { font-size: 1.4rem; }
                .enroll-hero { padding: 1.3rem; }
            }
        </style>
        <!-- ================= /PREMIUM ENROLLMENT DETAILS STYLES ================= -->

        <div class="container-fluid px-4 py-4">

            <!-- Hero -->
            <div class="enroll-hero">
                <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
                    <div>
                        <span class="hero-eyebrow"><i class="bi bi-file-earmark-text"></i> Details</span>
                        <h2 class="hero-title">Enrollment Details</h2>
                        <p class="hero-subtitle">Overview of courses, fees, and student information.</p>
                    </div>
                    <a th:href="${source == 'dashboard'} ? @{/dashboard} : @{/enrollments/enrollmentList}"
                       class="btn btn-hero-back"
                       th:text="${source == 'dashboard'} ? 'Back to Dashboard' : 'Back to Enrolled Students'">
                        <i class="bi bi-arrow-left me-1"></i> Back to Enrolled Students
                    </a>
                </div>
            </div>

            <div class="row g-4">

                <!-- Student Information -->
                <div class="col-lg-4">
                    <div class="card detail-card">
                        <div class="card-header">
                            <i class="bi bi-person-badge"></i>
                            <span>Student Information</span>
                        </div>
                        <div class="card-body">

                            <div class="info-row">
                                <span class="info-label">Name</span>
                                <span class="info-value" th:text="${enrollmentSummaryDTO.studentName}"></span>
                            </div>

                            <div class="info-row">
                                <span class="info-label">Email</span>
                                <span class="info-value" th:text="${enrollmentSummaryDTO.email}"></span>
                            </div>

                            <div class="summary-block">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="summary-label">Total Courses</span>
                                    <span class="summary-value" th:text="${enrollmentSummaryDTO.courseCount}"></span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="summary-label">Total Fee</span>
                                    <span class="fee-highlight">
                                            Rs.<span th:text="${enrollmentSummaryDTO.totalFee}"></span>
                                        </span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Enrolled Courses -->
                <div class="col-lg-8">
                    <div class="card detail-card">
                        <div class="card-header">
                            <i class="bi bi-journal-check"></i>
                            <span>Enrolled Courses</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>Course Name</th>
                                        <th>Description</th>
                                        <th class="text-end">Fee</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="course : ${enrollmentSummaryDTO.courseList}">
                                        <td data-label="Course Name" th:text="${course.courseName}"></td>
                                        <td data-label="Description" th:text="${course.description}"></td>
                                        <td data-label="Fee" class="text-end" th:text="${course.fee}"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
