<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <!-- ================= PREMIUM COURSE STYLES ================= -->
        <style>
            #page-content-wrapper {
                background:
                    radial-gradient(1200px 600px at 100% -10%, rgba(67,97,238,0.08), transparent 60%),
                    radial-gradient(900px 500px at -10% 100%, rgba(114,9,183,0.06), transparent 60%),
                    #f4f6fb;
                min-height: 100vh;
            }

            /* Header */
            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 1rem;
                flex-wrap: wrap;
                margin-bottom: 1.5rem;
            }

            .page-eyebrow {
                display: inline-flex;
                align-items: center;
                gap: .4rem;
                font-size: .72rem;
                font-weight: 600;
                letter-spacing: 1px;
                text-transform: uppercase;
                color: #4361ee;
                background: rgba(67,97,238,.1);
                padding: .35rem .7rem;
                border-radius: 2rem;
                margin-bottom: .6rem;
            }

            .page-title {
                font-size: 1.9rem;
                font-weight: 700;
                color: #1e2129;
                margin: 0;
                letter-spacing: -0.5px;
            }

            .page-subtitle {
                color: #7a8194;
                font-size: .92rem;
                margin: .25rem 0 0;
            }

            /* Add button */
            .btn-add {
                background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
                border: none;
                color: #fff;
                font-weight: 600;
                padding: .7rem 1.2rem;
                border-radius: .75rem;
                display: inline-flex;
                align-items: center;
                gap: .4rem;
                box-shadow: 0 10px 20px -8px rgba(67,97,238,.6);
                transition: all .25s ease;
            }

            .btn-add:hover {
                color: #fff;
                transform: translateY(-2px);
                box-shadow: 0 14px 26px -10px rgba(67,97,238,.7);
            }

            /* Success alert */
            .alert-success {
                background: #e8fff6;
                border: 1px solid #b9f0d8;
                color: #0f766e;
                border-radius: .9rem;
                font-weight: 500;
            }

            /* Card */
            .table-card {
                border-radius: 1.25rem;
                border: 1px solid #eef1f6;
                background: #fff;
                overflow: hidden;
                box-shadow: 0 12px 30px -18px rgba(20, 30, 70, .25);
            }

            .table-card .card-header {
                background: #fff !important;
                border-bottom: 1px solid #eef1f6;
                padding: 1.1rem 1.4rem;
                border-radius: 1.25rem 1.25rem 0 0 !important;
                display: flex;
                align-items: center;
                gap: .55rem;
            }

            .table-card .card-header i {
                width: 32px;
                height: 32px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: .6rem;
                background: rgba(67,97,238,.1);
                color: #4361ee;
            }

            .table-card .card-header span {
                font-weight: 600;
                color: #1e2129;
                font-size: .95rem;
            }

            /* Table */
            .table thead th {
                background: #f8fafc;
                color: #667085;
                font-size: .72rem;
                font-weight: 700;
                letter-spacing: .8px;
                text-transform: uppercase;
                border-bottom: 1px solid #eef1f6 !important;
                padding: .9rem 1rem;
                white-space: nowrap;
            }

            .table tbody td {
                padding: 1rem;
                color: #344054;
                font-size: .9rem;
                border-color: #f2f4f8;
                vertical-align: middle;
            }

            .table tbody tr { transition: background .2s ease; }
            .table tbody tr:hover { background: #f7f9ff; }

            .table tbody td:first-child {
                font-weight: 600;
                color: #4361ee;
            }

            /* Code pill */
            .code-pill {
                display: inline-block;
                padding: .25rem .65rem;
                background: #eaf0ff;
                color: #4361ee;
                border: 1px solid #dbe4ff;
                border-radius: 2rem;
                font-size: .78rem;
                font-weight: 600;
                letter-spacing: .3px;
            }

            /* Fee style */
            .fee-text {
                font-weight: 600;
                color: #0f766e;
            }

            /* Action buttons */
            .btn-icon {
                width: 34px;
                height: 34px;
                padding: 0;
                border-radius: .6rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid transparent;
                transition: all .2s ease;
            }

            .btn-view {
                background: #eaf0ff;
                color: #4361ee !important;
                border-color: #dbe4ff;
            }
            .btn-view:hover {
                background: #4361ee;
                color: #fff !important;
                transform: translateY(-2px);
                box-shadow: 0 8px 16px -6px rgba(67,97,238,.5);
            }

            .btn-edit {
                background: #fff4e5;
                color: #b45309 !important;
                border-color: #fde3c2;
            }
            .btn-edit:hover {
                background: #f59e0b;
                color: #fff !important;
                transform: translateY(-2px);
                box-shadow: 0 8px 16px -6px rgba(245,158,11,.5);
            }

            /* Empty state */
            .empty-state {
                text-align: center;
                padding: 3.5rem 1rem;
                color: #94a3b8;
            }
            .empty-state i {
                font-size: 3rem;
                display: block;
                margin-bottom: .75rem;
                opacity: .5;
            }
            .empty-state p { font-size: .95rem; margin-bottom: 0; }

            /* Pagination */
            .pagination {
                gap: .35rem;
                margin-top: 1rem;
            }

            .pagination .page-link {
                border: 1px solid #eef1f6;
                border-radius: .6rem !important;
                color: #475467;
                font-size: .85rem;
                font-weight: 500;
                padding: .45rem .85rem;
                background: #fff;
                transition: all .2s ease;
            }

            .pagination .page-link:hover {
                background: #eaf0ff;
                color: #4361ee;
                border-color: #dbe4ff;
            }

            .pagination .page-item.active .page-link {
                background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
                border-color: transparent;
                color: #fff;
                box-shadow: 0 8px 16px -8px rgba(67,97,238,.6);
            }

            .pagination .page-item.disabled .page-link {
                color: #cbd5e1;
                background: #f8fafc;
                border-color: #eef1f6;
            }

            @media (max-width: 768px) {
                .page-title { font-size: 1.5rem; }
            }
        </style>
        <!-- ================= /PREMIUM COURSE STYLES ================= -->

        <div class="container-fluid px-4 py-4">

            <!-- Header -->
            <div class="page-header">
                <div>
                    <span class="page-eyebrow"><i class="bi bi-book-half"></i> Course Management</span>
                    <h2 class="page-title">Courses</h2>
                    <p class="page-subtitle">Manage all courses offered in the system</p>
                </div>
                <a th:href="@{/course/new}" class="btn btn-add"><i class="bi bi-plus-lg"></i> Add New Course</a>
            </div>

            <!-- Success Alert -->
            <div th:if="${message}" class="alert alert-success text-center" role="alert" th:text="${message}"></div>

            <!-- Card -->
            <div class="card table-card mb-4">
                <div class="card-header">
                    <i class="bi bi-table"></i>
                    <span>Course List</span>
                </div>
                <div class="card-body">

                    <!-- Empty state (logic same) -->
                    <div class="empty-state" th:if="${courses == null or courses.content.isEmpty()}">
                        <i class="bi bi-inbox"></i>
                        <p>No course found</p>
                    </div>

                    <!-- Table (logic same) -->
                    <div class="table-responsive" th:if="${courses != null and !courses.content.isEmpty()}">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Course Name</th>
                                <th>Course Code</th>
                                <th>Course Fees</th>
                                <th>Duration</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="course : ${courses.content}">
                                <td data-label="ID" th:text="${course.id}"></td>
                                <td data-label="Course Name" th:text="${course.courseName}"></td>
                                <td data-label="Couse Code">
                                    <span class="code-pill" th:text="${course.courseCode}">ICS</span>
                                </td>
                                <td data-label="Couse Fees">
                                    <span class="fee-text" th:text="${course.fee}">Rs.3999</span>
                                </td>
                                <td data-label="Duration" th:text="${course.duration}">4 Months</td>
                                <td data-label="Actions" class="text-end">
                                    <a th:href="@{'/course/' + ${course.id}}" class="btn btn-sm btn-icon btn-view me-1" title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/course/{id}/edit(id=${course.id})}" class="btn btn-sm btn-icon btn-edit" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination (logic same) -->
                    <nav th:if="${courses.totalPages > 0}" aria-label="Course pagination">
                        <ul class="pagination justify-content-end">
                            <!-- Previous -->
                            <li class="page-item" th:classappend="${courses.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/course/list(page=${courses.number - 1},size=${courses.size})}">
                                    Previous
                                </a>
                            </li>
                            <!-- Page Numbers -->
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, courses.totalPages - 1)}"
                                th:classappend="${pageNum == courses.number} ? 'active'">
                                <a class="page-link" th:href="@{/course/list(page=${pageNum},size=${courses.size})}"
                                   th:text="${pageNum + 1}"></a>
                            </li>
                            <!-- Next -->
                            <li class="page-item" th:classappend="${courses.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/course/list(page=${courses.number + 1},size=${courses.size})}">
                                    Next
                                </a>
                            </li>
                        </ul>
                    </nav>

                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
