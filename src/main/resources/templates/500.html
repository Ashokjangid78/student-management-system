<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<!-- ================= PREMIUM ERROR STYLES ================= -->
<style>
    .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        position: relative;
        overflow: hidden;
    }

    .error-card {
        background: #fff;
        border-radius: 1.5rem;
        box-shadow: 0 30px 60px -20px rgba(20, 30, 70, .35);
        padding: 3rem 2.5rem;
        max-width: 520px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 2;
        animation: floatIn .5s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes floatIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .error-icon-wrap {
        width: 90px;
        height: 90px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.4rem;
        color: #dc2626;
        box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 10px 20px -10px rgba(220,38,38,.4);
    }

    .error-code {
        font-size: 5.5rem;
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
        margin: 0 0 .5rem;
        background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .error-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: #1e2129;
        margin: 0 0 .5rem;
    }

    .error-desc {
        color: #7a8194;
        font-size: .95rem;
        margin-bottom: 2rem;
        line-height: 1.6;
    }

    .btn-home {
        background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        border: none;
        color: #fff;
        font-weight: 600;
        padding: .8rem 1.6rem;
        border-radius: .75rem;
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        box-shadow: 0 12px 24px -10px rgba(67,97,238,.7);
        transition: all .25s ease;
    }

    .btn-home:hover {
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 16px 30px -12px rgba(67,97,238,.8);
    }

    /* Decorative blobs behind card */
    .error-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: .5;
        z-index: 1;
    }

    .blob-1 {
        width: 320px;
        height: 320px;
        background: rgba(67,97,238,.35);
        top: -80px;
        right: -80px;
    }

    .blob-2 {
        width: 260px;
        height: 260px;
        background: rgba(220,38,38,.25);
        bottom: -60px;
        left: -60px;
    }

    @media (max-width: 576px) {
        .error-card { padding: 2.2rem 1.5rem; }
        .error-code { font-size: 4.2rem; }
        .error-icon-wrap { width: 76px; height: 76px; font-size: 2rem; }
    }
</style>
<!-- ================= /PREMIUM ERROR STYLES ================= -->

<div class="error-page">
    <div class="error-blob blob-1"></div>
    <div class="error-blob blob-2"></div>

    <div class="error-card">
        <div class="error-icon-wrap">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h1 class="error-code">500</h1>
        <p class="error-title">Internal Server Error</p>
        <p class="error-desc">
            Something went wrong on our end. Please try again later.
        </p>

        <a href="dashboard.html" class="btn btn-home">
            <i class="bi bi-house-door"></i> Back to Home
        </a>
    </div>
</div>
</body>

</html>
