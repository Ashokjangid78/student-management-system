<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="login-wrapper">
    <div class="login-card-modern">

        <!-- Left Branding Panel -->
        <div class="login-brand-panel">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1 class="brand-title">SMS</h1>
                <p class="brand-subtitle">Student Management System</p>
                <div class="brand-divider"></div>
                <p class="brand-desc">Manage students, courses & enrollments — all in one place.</p>
            </div>
            <div class="brand-decor decor-1"></div>
            <div class="brand-decor decor-2"></div>
            <div class="brand-decor decor-3"></div>
        </div>

        <!-- Right Form Panel -->
        <div class="login-form-panel">
            <div class="form-inner">
                <h2 class="login-title">Welcome Back 👋</h2>
                <p class="login-subtitle">Sign in to continue to your dashboard</p>

                <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                    Invalid username or password. Please try again.
                </div>

                <div th:if="${param.logout}" class="alert alert-success">
                    You have been logged out successfully.
                </div>

                <div th:if="${message}" class="alert alert-danger text-center" role="alert" th:text="${message}"></div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-4">
                        <label for="username" class="form-label-modern">USERNAME</label>
                        <div class="input-group input-group-modern">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Enter your username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label-modern">PASSWORD</label>
                        <div class="input-group input-group-modern">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-login">
                            <span>Login</span>
                            <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>

                <p class="login-footer-text">© Student Management System</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
